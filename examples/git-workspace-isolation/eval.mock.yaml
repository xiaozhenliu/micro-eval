# Offline smoke for the git-workspace-isolation example.
# Uses git_repo workspace: each cell runs inside an isolated git worktree.
# fixture-repo/ must be initialized as a git repo before running — run.py does this automatically.
project_name: git-workspace-isolation-mock
description: >
  Demonstrates git_repo workspace with git worktree isolation, OS policy sandbox config,
  fixture digest + toolchain fingerprint, and trend analysis with drift breakpoints.

configurations:
  - id: refactor-agent-v1
    name: Refactor Agent v1
    role: baseline
    repetitions: 2
    agent:
      name: Refactor Agent v1
      command: ["{python}", "scripts/mock-refactor-agent.py"]
      input_mode: stdin
      output_mode: stdout
      timeout_s: 60
      env: {}
      required_secrets: []

tasks:
  - tasks/refactor-extract-function.yaml
  - tasks/add-type-hints.yaml
output_dir: .micro-eval/runs

guardrails:
  max_concurrency: 1
  timeout_s: 60
  output_cap_bytes: 1048576
  artifact_cap_bytes: 1048576
  stop_on_cell_error: false

evaluation:
  comparison_subject: "mock refactor agent smoke for git_repo workspace"
  task_set_version: "git-workspace-isolation.v1"
  success_criteria:
    - The agent reads the task prompt and outputs the required completion marker.
    - The worktree isolation ensures each cell starts from the same git commit.
    - SameStartSnapshot records fixture digest and toolchain fingerprint.
  budget: null
  decision_threshold: null
  inconclusive_policy: warn
  min_repetitions: 1
  required_evaluators: [validator]
  denominator_policy: include_failed

# Process-level trace (wall clock, exit code). Switch to langfuse for cloud tracing.
trace:
  enabled: true
  provider: process

# LLM judge disabled for offline smoke. Enable with an OpenAI key:
#   judge:
#     enabled: true
#     provider: deepeval
#     model: "gpt-4o"
#     required_secrets: [MICRO_EVAL_SECRET_OPENAI_KEY]
judge:
  enabled: false
  provider: deepeval
  model: ""
  temperature: 0.0
  pass_threshold: 0.5
  required_secrets: []
