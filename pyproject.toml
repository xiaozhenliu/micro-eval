[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "micro-eval"
version = "0.1.1"
description = "Agent/Skill evaluation assistant for small AI teams"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
scoring = ["deepeval>=0.20"]
observability = ["langfuse>=2.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
micro-eval = "micro_eval.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/micro_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]
